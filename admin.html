<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GDJSS 2021 - Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6f9;
    color:#222;
}

header{
    background:#0b3d2e;
    color:white;
    padding:25px 15px;
    text-align:center;
}

header h1{
    margin:0 0 8px;
    font-size:24px;
}

.container{
    width:95%;
    max-width:1100px;
    margin:25px auto;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

input{
    width:100%;
    padding:13px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:15px;
}

button{
    border:0;
    padding:12px 16px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
    margin:5px 3px;
}

.login-btn{
    width:100%;
    background:#0b3d2e;
    color:white;
    font-size:16px;
}

.approve{
    background:#198754;
    color:white;
}

.reject{
    background:#dc3545;
    color:white;
}

.logout{
    background:#dc3545;
    color:white;
    float:right;
}

.refresh{
    background:#0b3d2e;
    color:white;
}

.member{
    border:1px solid #ddd;
    border-radius:12px;
    padding:18px;
    margin:15px 0;
    background:#fff;
}

.member h3{
    color:#0b3d2e;
    margin-top:0;
}

.member-id{
    color:#0b3d2e;
    font-size:19px;
    font-weight:bold;
    margin-bottom:10px;
}

.photo{
    width:150px;
    height:150px;
    object-fit:cover;
    border-radius:10px;
    border:3px solid #0b3d2e;
    display:block;
    margin-bottom:15px;
    background:#eee;
}

.no-photo{
    width:150px;
    height:150px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:#eee;
    color:#777;
    border-radius:10px;
    margin-bottom:15px;
}

.member-layout{
    display:flex;
    gap:25px;
    align-items:flex-start;
}

.member-details{
    flex:1;
}

.count{
    font-size:18px;
    font-weight:bold;
}

.status{
    font-weight:bold;
}

.error{
    color:#dc3545;
    font-weight:bold;
}

.success{
    color:#198754;
    font-weight:bold;
}

.loading{
    color:#555;
}

.empty{
    color:#777;
}

#dashboard{
    display:none;
}

@media(max-width:600px){

    header h1{
        font-size:20px;
    }

    .card{
        padding:15px;
    }

    button{
        width:100%;
        margin:5px 0;
    }

    .logout{
        float:none;
        width:100%;
    }

    .member-layout{
        display:block;
    }

    .photo,
    .no-photo{
        width:130px;
        height:130px;
    }
}

</style>

</head>

<body>


<header>

<h1>
GDJSS CENTRAL CLASS OF 2021
</h1>

<p>
Admin Dashboard
</p>

</header>


<div class="container">


<!-- LOGIN -->

<div id="loginBox" class="card">

<h2>🔐 Admin Login</h2>

<input
type="email"
id="adminEmail"
placeholder="Admin Email"
>

<input
type="password"
id="adminPassword"
placeholder="Password"
>

<button
type="button"
class="login-btn"
id="loginButton"
>
Login
</button>

<p id="loginMessage"></p>

</div>


<!-- DASHBOARD -->

<div id="dashboard">


<div class="card">

<button
type="button"
class="logout"
id="logoutButton"
>
Logout
</button>

<h2>
📊 Admin Dashboard
</h2>

<p class="count">
⏳ Pending Members:
<span id="pendingCount">0</span>
</p>

<p class="count">
✅ Approved Members:
<span id="approvedCount">0</span>
</p>

<button
type="button"
class="refresh"
id="refreshButton"
>
🔄 Refresh
</button>

</div>


<!-- PENDING -->

<div class="card">

<h2>
⏳ Pending Registrations
</h2>

<div id="pendingMembers">
Loading...
</div>

</div>


<!-- APPROVED -->

<div class="card">

<h2>
✅ Approved Members
</h2>

<div id="approvedMembers">
Loading...
</div>

</div>


</div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://nfivwaxynfcqumupcttp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_cW8I1UvkW1jvGNDeh_NTPg_QicAc9G7";


const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY,
{
    auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:false
    }
}
);


/* =========================================
   ELEMENTS
========================================= */

const loginBox =
document.getElementById("loginBox");

const dashboard =
document.getElementById("dashboard");

const loginButton =
document.getElementById("loginButton");

const logoutButton =
document.getElementById("logoutButton");

const refreshButton =
document.getElementById("refreshButton");

const loginMessage =
document.getElementById("loginMessage");


/* =========================================
   LOGIN
========================================= */

loginButton.addEventListener(
"click",
loginAdmin
);


async function loginAdmin(){

const email =
document.getElementById("adminEmail")
.value
.trim();

const password =
document.getElementById("adminPassword")
.value;


if(!email || !password){

loginMessage.className =
"error";

loginMessage.textContent =
"Please enter email and password.";

return;

}


loginButton.disabled =
true;

loginButton.textContent =
"Logging in...";


try{

const result =
await db.auth.signInWithPassword({

email:email,

password:password

});


if(result.error){

loginMessage.className =
"error";

loginMessage.textContent =
result.error.message;

return;

}


loginBox.style.display =
"none";

dashboard.style.display =
"block";

await loadRegistrations();


}catch(error){

console.error(error);

loginMessage.className =
"error";

loginMessage.textContent =
"Error: " + error.message;

}finally{

loginButton.disabled =
false;

loginButton.textContent =
"Login";

}

}


/* =========================================
   LOGOUT
========================================= */

logoutButton.addEventListener(
"click",
async function(){

await db.auth.signOut();

dashboard.style.display =
"none";

loginBox.style.display =
"block";

document.getElementById(
"adminPassword"
).value = "";

}
);


/* =========================================
   REFRESH
========================================= */

refreshButton.addEventListener(
"click",
loadRegistrations
);


/* =========================================
   LOAD REGISTRATIONS
========================================= */

async function loadRegistrations(){

const pendingBox =
document.getElementById(
"pendingMembers"
);

const approvedBox =
document.getElementById(
"approvedMembers"
);


pendingBox.innerHTML =
"<p>Loading registrations...</p>";

approvedBox.innerHTML =
"<p>Loading members...</p>";


const result =
await db
.from("registrations")
.select("*")
.order(
"id",
{
    ascending:false
}
);


if(result.error){

console.error(
result.error
);

pendingBox.innerHTML =
"<p class='error'>" +
escapeHtml(
result.error.message
) +
"</p>";

return;

}


const registrations =
result.data || [];


const pending =
registrations.filter(
member =>
member.status === "pending"
);


const approved =
registrations.filter(
member =>
member.status === "approved"
);


document.getElementById(
"pendingCount"
).textContent =
pending.length;


document.getElementById(
"approvedCount"
).textContent =
approved.length;


renderPending(pending);

renderApproved(approved);

}


/* =========================================
   PENDING
========================================= */

function renderPending(members){

const box =
document.getElementById(
"pendingMembers"
);


if(members.length === 0){

box.innerHTML =
"<p class='empty'>No pending registrations.</p>";

return;

}


box.innerHTML =
members.map(
member => {

let photoHTML = "";


/*
   IMPORTANT:
   We use photo_url DIRECTLY.
*/

if(
member.photo_url &&
member.photo_url.trim() !== ""
){

photoHTML = `

<img
class="photo"
src="${member.photo_url}"
alt="Passport Photo"
loading="lazy"
onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
>

<div
class="no-photo"
style="display:none"
>
Photo could not be loaded
</div>

`;

}else{

photoHTML = `

<div class="no-photo">
No Passport Photo
</div>

`;

}


return `

<div class="member">

<div class="member-layout">


<div>

${photoHTML}

</div>


<div class="member-details">

<h3>
${escapeHtml(
member.full_name ||
"No Name"
)}
</h3>


<p>
<b>Phone:</b>
${escapeHtml(
member.phone || ""
)}
</p>


<p>
<b>Gender:</b>
${escapeHtml(
member.gender || ""
)}
</p>


<p>
<b>State:</b>
${escapeHtml(
member.state || ""
)}
</p>


<p>
<b>City:</b>
${escapeHtml(
member.city || ""
)}
</p>


<p>
<b>Address:</b>
${escapeHtml(
member.address || ""
)}
</p>


<p>
<b>Class / Section:</b>
${escapeHtml(
member.class_section || ""
)}
</p>


<p>
<b>WhatsApp:</b>
${escapeHtml(
member.whatsapp || ""
)}
</p>


<p>
<b>Occupation:</b>
${escapeHtml(
member.occupation || ""
)}
</p>


<p>
<b>Email:</b>
${escapeHtml(
member.email || ""
)}
</p>


<p>
<b>Status:</b>
Pending
</p>

</div>

</div>


<button
class="approve"
type="button"
onclick="approveMember(${Number(member.id)})"
>
✓ Approve
</button>


<button
class="reject"
type="button"
onclick="rejectMember(${Number(member.id)})"
>
✕ Reject
</button>


</div>

`;

}
).join("");

}


/* =========================================
   APPROVED
========================================= */

function renderApproved(members){

const box =
document.getElementById(
"approvedMembers"
);


if(members.length === 0){

box.innerHTML =
"<p class='empty'>No approved members yet.</p>";

return;

}


box.innerHTML =
members.map(
member => {

let photoHTML = "";


if(
member.photo_url &&
member.photo_url.trim() !== ""
){

photoHTML = `

<img
class="photo"
src="${member.photo_url}"
alt="Passport Photo"
loading="lazy"
>

`;

}else{

photoHTML = `

<div class="no-photo">
No Passport Photo
</div>

`;

}


return `

<div class="member">

<div class="member-layout">

<div>
${photoHTML}
</div>


<div class="member-details">

<div class="member-id">

🆔
${escapeHtml(
member.member_id ||
"No Member ID"
)}

</div>


<h3>
${escapeHtml(
member.full_name ||
"No Name"
)}
</h3>


<p>
<b>Phone:</b>
${escapeHtml(
member.phone || ""
)}
</p>


<p>
<b>Email:</b>
${escapeHtml(
member.email || ""
)}
</p>


<p>
<b>State:</b>
${escapeHtml(
member.state || ""
)}
</p>


<p>
<b>City:</b>
${escapeHtml(
member.city || ""
)}
</p>


<p class="status">
Status: Approved
</p>

</div>

</div>

</div>

`;

}
).join("");

}


/* =========================================
   APPROVE
========================================= */

async function approveMember(
registrationId
){

if(
!confirm(
"Are you sure you want to approve this member?"
)
){

return;

}


try{


const result =
await db.rpc(
"approve_registration",
{
registration_id:
registrationId
}
);


if(result.error){

alert(
"Approval error: " +
result.error.message
);

return;

}


alert(
"Member approved successfully!\n\n" +
(
result.data ||
"Member ID generated."
)
);


await loadRegistrations();


}catch(error){

console.error(error);

alert(
"Error: " +
error.message
);

}

}


/* =========================================
   REJECT
========================================= */

async function rejectMember(
registrationId
){

if(
!confirm(
"Are you sure you want to reject this registration?"
)
){

return;

}


const result =
await db
.from("registrations")
.update({
status:"rejected"
})
.eq(
"id",
registrationId
);


if(result.error){

alert(
"Reject error: " +
result.error.message
);

return;

}


alert(
"Registration rejected."
);


await loadRegistrations();

}


/* =========================================
   SECURITY
========================================= */

function escapeHtml(value){

return String(value)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================================
   CHECK SESSION
========================================= */

async function checkSession(){

const result =
await db.auth.getSession();


if(
result.data &&
result.data.session
){

loginBox.style.display =
"none";

dashboard.style.display =
"block";

await loadRegistrations();

}

}


/* =========================================
   START
========================================= */

checkSession();

</script>

</body>
</html>
