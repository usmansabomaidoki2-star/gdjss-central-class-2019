<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GDJSS 2019 - Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6f9;
    color:#222;
}

header{
    background:#0b3d2e;
    color:white;
    padding:25px 15px;
    text-align:center;
}

header h1{
    margin:0 0 8px;
    font-size:24px;
}

.container{
    width:95%;
    max-width:1100px;
    margin:25px auto;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

input{
    width:100%;
    padding:13px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:15px;
}

button{
    border:0;
    padding:11px 16px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
    margin:5px 3px;
}

.login-btn{
    width:100%;
    background:#0b3d2e;
    color:white;
    font-size:16px;
}

.approve{
    background:#198754;
    color:white;
}

.reject{
    background:#dc3545;
    color:white;
}

.logout{
    background:#dc3545;
    color:white;
    float:right;
}

.refresh{
    background:#0b3d2e;
    color:white;
}

.member{
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
    margin:15px 0;
    background:#fff;
}

.member h3{
    margin-top:0;
    color:#0b3d2e;
}

.member-id{
    color:#0b3d2e;
    font-size:19px;
    font-weight:bold;
    margin-bottom:8px;
}

.status{
    font-weight:bold;
}

.error{
    color:#dc3545;
    font-weight:bold;
}

.success{
    color:#198754;
    font-weight:bold;
}

.info{
    color:#555;
}

.count{
    font-size:18px;
    font-weight:bold;
}

#dashboard{
    display:none;
}

.loading{
    color:#555;
    padding:10px 0;
}

.empty{
    color:#777;
    padding:10px 0;
}

.photo{
    width:90px;
    height:90px;
    object-fit:cover;
    border-radius:50%;
    border:2px solid #ddd;
    margin-bottom:10px;
}

@media(max-width:600px){
    header h1{
        font-size:20px;
    }

    .card{
        padding:15px;
    }

    button{
        width:100%;
        margin:5px 0;
    }

    .logout{
        float:none;
        width:100%;
    }
}
</style>
</head>

<body>

<header>
    <h1>GDJSS CENTRAL CLASS OF 2019</h1>
    <p>Admin Dashboard</p>
</header>

<div class="container">

<!-- ================= LOGIN ================= -->

<div id="loginBox" class="card">

    <h2>🔐 Admin Login</h2>

    <input
        type="email"
        id="adminEmail"
        placeholder="Admin Email"
        autocomplete="email"
    >

    <input
        type="password"
        id="adminPassword"
        placeholder="Password"
        autocomplete="current-password"
    >

    <button
        type="button"
        class="login-btn"
        id="loginButton"
    >
        Login
    </button>

    <p id="loginMessage"></p>

</div>


<!-- ================= DASHBOARD ================= -->

<div id="dashboard">

    <div class="card">

        <button
            type="button"
            class="logout"
            id="logoutButton"
        >
            Logout
        </button>

        <h2>📊 Admin Dashboard</h2>

        <p class="count">
            Pending Members:
            <span id="pendingCount">0</span>
        </p>

        <p class="count">
            Approved Members:
            <span id="approvedCount">0</span>
        </p>

        <button
            type="button"
            class="refresh"
            id="refreshButton"
        >
            🔄 Refresh Members
        </button>

    </div>


    <!-- ================= PENDING ================= -->

    <div class="card">

        <h2>⏳ Pending Registrations</h2>

        <div id="pendingMembers">
            <p class="loading">Loading...</p>
        </div>

    </div>


    <!-- ================= APPROVED ================= -->

    <div class="card">

        <h2>✅ Approved Members</h2>

        <div id="approvedMembers">
            <p class="loading">Loading...</p>
        </div>

    </div>

</div>

</div>


<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

/*
   KA SAKA BAYANAN NAN:

   1. SUPABASE_URL = Project URL
   2. SUPABASE_ANON_KEY = Publishable key

   KADA KA SAKA sb_secret... KO service_role key.
*/

const SUPABASE_URL =
    "https://nfivwaxynfcqumupcttp.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_cW8I1UvkW1jvGNDeh_NTPg_QicAc9G7";


/* =====================================================
   CREATE SUPABASE CLIENT
===================================================== */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =====================================================
   GET ELEMENTS
===================================================== */

const loginBox =
    document.getElementById("loginBox");

const dashboard =
    document.getElementById("dashboard");

const loginButton =
    document.getElementById("loginButton");

const logoutButton =
    document.getElementById("logoutButton");

const refreshButton =
    document.getElementById("refreshButton");

const loginMessage =
    document.getElementById("loginMessage");


/* =====================================================
   LOGIN
===================================================== */

loginButton.addEventListener("click", loginAdmin);


async function loginAdmin(){

    const email =
        document.getElementById("adminEmail")
        .value
        .trim();

    const password =
        document.getElementById("adminPassword")
        .value;

    loginMessage.className = "";
    loginMessage.textContent = "Logging in...";

    if(!email || !password){

        loginMessage.className = "error";

        loginMessage.textContent =
            "Please enter email and password.";

        return;
    }

    try{

        const result =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

        const data = result.data;
        const error = result.error;

        if(error){

            loginMessage.className = "error";

            loginMessage.textContent =
                "Login error: " + error.message;

            return;
        }

        if(!data || !data.user){

            loginMessage.className = "error";

            loginMessage.textContent =
                "Login failed. Admin user was not found.";

            return;
        }

        loginMessage.className = "success";

        loginMessage.textContent =
            "Login successful!";

        loginBox.style.display = "none";

        dashboard.style.display = "block";

        await loadMembers();

    }catch(error){

        console.error(error);

        loginMessage.className = "error";

        loginMessage.textContent =
            "Error: " +
            (error.message || "Unknown error");
    }
}


/* =====================================================
   LOGOUT
===================================================== */

logoutButton.addEventListener("click", logoutAdmin);


async function logoutAdmin(){

    await supabaseClient.auth.signOut();

    dashboard.style.display = "none";

    loginBox.style.display = "block";

    document.getElementById("adminPassword").value = "";

    loginMessage.className = "";

    loginMessage.textContent = "";
}


/* =====================================================
   LOAD MEMBERS
===================================================== */

refreshButton.addEventListener("click", loadMembers);


async function loadMembers(){

    const pendingBox =
        document.getElementById("pendingMembers");

    const approvedBox =
        document.getElementById("approvedMembers");

    pendingBox.innerHTML =
        '<p class="loading">Loading members...</p>';

    approvedBox.innerHTML =
        '<p class="loading">Loading members...</p>';

    try{

        const result =
            await supabaseClient
            .from("Members")
            .select("*")
            .order("id", {
                ascending:false
            });

        const data = result.data;
        const error = result.error;

        if(error){

            pendingBox.innerHTML =
                '<p class="error">' +
                escapeHtml(error.message) +
                '</p>';

            approvedBox.innerHTML = "";

            return;
        }

        const members = data || [];

        const pending =
            members.filter(function(member){

                return member.status === "pending";

            });

        const approved =
            members.filter(function(member){

                return member.status === "approved";

            });


        document.getElementById("pendingCount")
            .textContent = pending.length;

        document.getElementById("approvedCount")
            .textContent = approved.length;


        renderPendingMembers(pending);

        renderApprovedMembers(approved);

    }catch(error){

        console.error(error);

        pendingBox.innerHTML =
            '<p class="error">' +
            escapeHtml(error.message) +
            '</p>';

        approvedBox.innerHTML = "";
    }
}


/* =====================================================
   SHOW PENDING MEMBERS
===================================================== */

function renderPendingMembers(members){

    const box =
        document.getElementById("pendingMembers");

    if(members.length === 0){

        box.innerHTML =
            '<p class="empty">No pending registrations.</p>';

        return;
    }

    box.innerHTML =
        members.map(function(member){

            return `

            <div class="member">

                <h3>
                    ${escapeHtml(member.full_name || "No Name")}
                </h3>

                <p>
                    <b>Phone:</b>
                    ${escapeHtml(member.phone || "")}
                </p>

                <p>
                    <b>Gender:</b>
                    ${escapeHtml(member.gender || "")}
                </p>

                <p>
                    <b>State:</b>
                    ${escapeHtml(member.state || "")}
                </p>

                <p>
                    <b>City:</b>
                    ${escapeHtml(member.city || "")}
                </p>

                <p>
                    <b>Class/Section:</b>
                    ${escapeHtml(
                        member.class_section ||
                        member["class section"] ||
                        ""
                    )}
                </p>

                <p>
                    <b>Occupation:</b>
                    ${escapeHtml(
                        member.occupation ||
                        member.occupayion ||
                        ""
                    )}
                </p>

                <p>
                    <b>Email:</b>
                    ${escapeHtml(member.email || "")}
                </p>

                <p>
                    <b>Status:</b>
                    Pending
                </p>

                <button
                    type="button"
                    class="approve"
                    onclick="approveMember('${member.id}')"
                >
                    ✓ Approve
                </button>

                <button
                    type="button"
                    class="reject"
                    onclick="rejectMember('${member.id}')"
                >
                    ✕ Reject
                </button>

            </div>

            `;

        }).join("");
}


/* =====================================================
   SHOW APPROVED MEMBERS
===================================================== */

function renderApprovedMembers(members){

    const box =
        document.getElementById("approvedMembers");

    if(members.length === 0){

        box.innerHTML =
            '<p class="empty">No approved members yet.</p>';

        return;
    }

    box.innerHTML =
        members.map(function(member){

            return `

            <div class="member">

                <div class="member-id">
                    🆔 ${escapeHtml(
                        member.member_id || "No Member ID"
                    )}
                </div>

                <h3>
                    ${escapeHtml(
                        member.full_name || "No Name"
                    )}
                </h3>

                <p>
                    <b>Phone:</b>
                    ${escapeHtml(member.phone || "")}
                </p>

                <p>
                    <b>Email:</b>
                    ${escapeHtml(member.email || "")}
                </p>

                <p class="status">
                    Status: Approved
                </p>

            </div>

            `;

        }).join("");
}


/* =====================================================
   APPROVE MEMBER
===================================================== */

async function approveMember(memberId){

    const confirmed =
        confirm(
            "Are you sure you want to approve this member?"
        );

    if(!confirmed){
        return;
    }

    try{

        const result =
            await supabaseClient.rpc(
                "approve_member",
                {
                    member_uuid: memberId
                }
            );

        const data = result.data;
        const error = result.error;

        if(error){

            alert(
                "Approval error: " +
                error.message
            );

            return;
        }

        alert(
            "Member approved successfully.\n\n" +
            "Member ID: " +
            data
        );

        await loadMembers();

    }catch(error){

        console.error(error);

        alert(
            "Error: " +
            (error.message || "Unknown error")
        );
    }
}


/* =====================================================
   REJECT MEMBER
===================================================== */

async function rejectMember(memberId){

    const confirmed =
        confirm(
            "Are you sure you want to reject this registration?"
        );

    if(!confirmed){
        return;
    }

    try{

        const result =
            await supabaseClient
            .from("Members")
            .update({
                status:"rejected"
            })
            .eq("id", memberId);

        const error = result.error;

        if(error){

            alert(
                "Reject error: " +
                error.message
            );

            return;
        }

        alert(
            "Registration rejected."
        );

        await loadMembers();

    }catch(error){

        console.error(error);

        alert(
            "Error: " +
            (error.message || "Unknown error")
        );
    }
}


/* =====================================================
   HTML SECURITY
===================================================== */

function escapeHtml(value){

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =====================================================
   CHECK EXISTING SESSION
===================================================== */

async function checkExistingSession(){

    try{

        const result =
            await supabaseClient.auth.getSession();

        const session =
            result.data.session;

        if(session){

            loginBox.style.display = "none";

            dashboard.style.display = "block";

            await loadMembers();
        }

    }catch(error){

        console.error(error);
    }
}


/* =====================================================
   START
===================================================== */

checkExistingSession();

</script>

</body>
</html>
