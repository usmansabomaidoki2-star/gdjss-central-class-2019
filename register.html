<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Registration - GDJSS 2021</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f7f6;
    }

    header {
      background: #075e54;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    .container {
      max-width: 650px;
      margin: 25px auto;
      padding: 20px;
    }

    .form-box {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    textarea {
      min-height: 90px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      background: #075e54;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 17px;
      font-weight: bold;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>GDJSS CENTRAL CLASS OF 2021</h1>
  <p>Member Registration</p>
</header>

<div class="container">

  <div class="form-box">

    <h2>Register as a Member</h2>

    <form id="registrationForm">

      <label>Full Name</label>
      <input type="text" id="full_name" required>

      <label>Phone Number</label>
      <input type="tel" id="phone" required>

      <label>Gender</label>
      <select id="gender" required>
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>

      <label>State</label>
      <input type="text" id="state" required>

      <label>City / Town</label>
      <input type="text" id="city" required>

      <label>Current Address</label>
      <textarea id="address"></textarea>

      <label>Class / Section</label>
      <input type="text" id="class_section">

      <label>WhatsApp Number</label>
      <input type="tel" id="whatsapp">

      <label>Passport Photo</label>
      <input type="file" id="passport_photo" accept="image/*" required>

      <label>Occupation</label>
      <input type="text" id="occupation">

      <label>Email</label>
      <input type="email" id="email">

      <button type="submit">Submit Registration</button>

      <div id="message"></div>

    </form>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL = "sb_publishable_cW8I1UvkW1jvGNDeh_NTPg_QicAc9G7 ";
  const SUPABASE_KEY = "sb_publishable_cW8I1UvkW1jvGNDeh_NTPg_QicAc9G7 ";

  const { createClient } = supabase;

  const db = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const form = document.getElementById("registrationForm");
  const message = document.getElementById("message");

  form.addEventListener("submit", async function(event) {

    event.preventDefault();

    message.textContent = "Submitting registration...";

    const photo = document.getElementById("passport_photo").files[0];

    if (!photo) {
      message.textContent = "Please select a passport photo.";
      return;
    }

    try {

      const fileName =
        Date.now() + "_" +
        photo.name.replace(/\s+/g, "_");

      const filePath = "members/" + fileName;
      const { error: uploadError } =
        await db.storage
          .from("passport-photos")
          .upload(filePath, photo);

      if (uploadError) {
        throw uploadError;
      }

      const { error: insertError } =
        await db
          .from("Members")
          .insert([{

            full_name:
              document.getElementById("full_name").value,

            phone:
              document.getElementById("phone").value,

            gender:
              document.getElementById("gender").value,

            state:
              document.getElementById("state").value,

            city:
              document.getElementById("city").value,

            address:
              document.getElementById("address").value,

            class_section:
              document.getElementById("class_section").value,

            whatsapp:
              document.getElementById("whatsapp").value,

            occupation:
              document.getElementById("occupation").value,

            email:
              document.getElementById("email").value,

            photo_url:
              filePath

          }]);

      if (insertError) {
        throw insertError;
      }

      message.textContent =
        "Registration submitted successfully!";

      form.reset();

    } catch (error) {

      console.error("Registration error:", error);

      message.textContent =
        "Error: " + (error.message || "Unknown error"); 

    }

  });

</script>

</body>
</html>
