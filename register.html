<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Registration - GDJSS 2019</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f7f6;
    }

    header {
      background: #075e54;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    .container {
      max-width: 650px;
      margin: 25px auto;
      padding: 20px;
    }

    .form-box {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    textarea {
      min-height: 90px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      background: #075e54;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 17px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>GDJSS CENTRAL CLASS OF 2019</h1>
  <p>Member Registration</p>
</header>

<div class="container">
  <div class="form-box">

    <h2>Register as a Member</h2>

    <form>

      <label>Full Name</label>
      <input type="text" placeholder="Enter your full name" required>

      <label>Phone Number</label>
      <input type="tel" placeholder="Enter phone number" required>

      <label>Gender</label>
      <select required>
        <option value="">Select Gender</option>
        <option>Male</option>
        <option>Female</option>
      </select>

      <label>State</label>
      <input type="text" placeholder="Enter your state" required>

      <label>City / Town</label>
      <input type="text" placeholder="Enter your city or town" required>

      <label>Current Address</label>
      <textarea placeholder="Enter your current address"></textarea>

      <label>Class / Section</label>
      <input type="text" placeholder="Enter your class or section">

      <label>WhatsApp Number</label>
      <input type="tel" placeholder="Enter WhatsApp number">

      <label>Passport Photo</label>
      <input type="file" accept="image/*">

      <label>Occupation</label>
      <input type="text" placeholder="Enter your occupation">

      <label>Email</label>
      <input type="email" placeholder="Enter your email address">

      <button type="submit">Submit Registration</button>

    </form>

  </div>
</div>

</body>
</html>
