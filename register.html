<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GDJSS CENTRAL CLASS OF 2019 - Registration</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7f6;
    color:#222;
}

header{
    background:#075e54;
    color:white;
    text-align:center;
    padding:25px 15px;
}

header h1{
    margin:0 0 8px;
    font-size:25px;
}

header p{
    margin:0;
}

.container{
    max-width:650px;
    margin:25px auto;
    padding:20px;
}

.form-box{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
}

h2{
    margin-top:0;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    margin-top:7px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:16px;
}

textarea{
    min-height:90px;
    resize:vertical;
}

button{
    width:100%;
    margin-top:22px;
    padding:14px;
    background:#075e54;
    color:white;
    border:none;
    border-radius:7px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    background:#777;
}

#message{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
    line-height:1.5;
}

.success{
    color:green;
}

.error{
    color:red;
}

.loading{
    color:#555;
}

</style>
</head>


<body>

<header>

<h1>
GDJSS CENTRAL CLASS OF 2019
</h1>

<p>
Member Registration
</p>

</header>


<div class="container">

<div class="form-box">

<h2>
Register as a Member
</h2>


<form id="registrationForm">


<label>
Full Name
</label>

<input
type="text"
id="fullName"
required
>


<label>
Phone Number
</label>

<input
type="tel"
id="phone"
required
>


<label>
Gender
</label>

<select
id="gender"
required
>

<option value="">
Select Gender
</option>

<option value="Male">
Male
</option>

<option value="Female">
Female
</option>

</select>


<label>
State
</label>

<input
type="text"
id="state"
required
>


<label>
City / Town
</label>

<input
type="text"
id="city"
required
>


<label>
Current Address
</label>

<textarea
id="address"
></textarea>


<label>
Class / Section
</label>

<input
type="text"
id="classSection"
>


<label>
WhatsApp Number
</label>

<input
type="tel"
id="whatsapp"
>


<label>
Occupation
</label>

<input
type="text"
id="occupation"
>


<label>
Email
</label>

<input
type="email"
id="email"
>


<label>
Passport Photo
</label>

<input
type="file"
id="passportPhoto"
accept="image/*"
required
>


<button
type="submit"
id="submitButton"
>

Submit Registration

</button>


<div id="message"></div>


</form>

</div>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =================================
   SUPABASE
================================= */

const SUPABASE_URL =
"https://nfivwaxynfcqumupcttp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_cW8I1UvkW1jvGNDeh_NTPg_QicAc9G7";


const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =================================
   FORM
================================= */

const form =
document.getElementById(
    "registrationForm"
);

const message =
document.getElementById(
    "message"
);

const submitButton =
document.getElementById(
    "submitButton"
);


/* =================================
   SUBMIT
================================= */

form.addEventListener(
"submit",
async function(event){

event.preventDefault();


message.className =
"loading";

message.textContent =
"Submitting registration...";

submitButton.disabled =
true;


try{


/* ================================
   GET DATA
================================ */

const fullName =
document
.getElementById("fullName")
.value
.trim();


const phone =
document
.getElementById("phone")
.value
.trim();


const gender =
document
.getElementById("gender")
.value;


const state =
document
.getElementById("state")
.value
.trim();


const city =
document
.getElementById("city")
.value
.trim();


const address =
document
.getElementById("address")
.value
.trim();


const classSection =
document
.getElementById("classSection")
.value
.trim();


const whatsapp =
document
.getElementById("whatsapp")
.value
.trim();


const occupation =
document
.getElementById("occupation")
.value
.trim();


const email =
document
.getElementById("email")
.value
.trim();


const photo =
document
.getElementById("passportPhoto")
.files[0];


if(!photo){

throw new Error(
"Please select a passport photo."
);

}


/* ================================
   FILE NAME
================================ */

const extension =
photo.name
.split(".")
.pop()
.toLowerCase();


const fileName =
Date.now() +
"_" +
Math.random()
.toString(36)
.substring(2,8) +
"." +
extension;


const filePath =
"members/" +
fileName;


/* ================================
   UPLOAD PHOTO
================================ */

message.textContent =
"Uploading passport photo...";


const upload =
await db.storage
.from("passport-photos")
.upload(
filePath,
photo,
{
contentType:photo.type,
upsert:false
}
);


if(upload.error){

throw new Error(
"Photo upload failed: " +
upload.error.message
);

}


/* ================================
   SAVE MEMBER
================================ */

message.textContent =
"Saving registration...";


const insert =
await db
.from("Members")
.insert({

"Phone":
phone,

"Full name":
fullName,

"Gender":
gender,

"State":
state,

"City":
city,

"Address":
address,

"Class section":
classSection,

"Whatsapp":
whatsapp,

"Occupation":
occupation,

"Email":
email,

"Photo_url":
filePath,

"status":
"pending"

});


if(insert.error){

throw new Error(
"Database error: " +
insert.error.message
);

}


/* ================================
   SUCCESS
================================ */

message.className =
"success";

message.textContent =
"Registration submitted successfully! Please wait for admin approval.";


form.reset();


}
catch(error){


console.error(
"Registration error:",
error
);


message.className =
"error";

message.textContent =
"Error: " +
(
error.message ||
"Unknown error"
);


}
finally{

submitButton.disabled =
false;

}

});

</script>

</body>

</html>
