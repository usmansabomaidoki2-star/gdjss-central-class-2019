<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>GDJSS CENTRAL CLASS OF 2021 - Registration</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7f6;
    color:#222;
}

header{
    background:#075e54;
    color:white;
    text-align:center;
    padding:28px 15px;
}

header h1{
    margin:0;
    font-size:24px;
}

header p{
    margin:8px 0 0;
    font-size:16px;
}

.container{
    max-width:650px;
    margin:25px auto;
    padding:15px;
}

.form-box{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.10);
}

h2{
    text-align:center;
    color:#075e54;
    margin-top:0;
}

label{
    display:block;
    margin-top:16px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:13px;
    margin-top:7px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:16px;
    font-family:Arial,sans-serif;
}

textarea{
    min-height:90px;
    resize:vertical;
}

button{
    width:100%;
    margin-top:24px;
    padding:15px;
    background:#075e54;
    color:white;
    border:none;
    border-radius:7px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    background:#777;
    cursor:not-allowed;
}

#message{
    margin-top:18px;
    text-align:center;
    font-weight:bold;
    line-height:1.5;
}

.success{
    color:green;
}

.error{
    color:red;
}

.loading{
    color:#555;
}

.note{
    background:#eef8f6;
    padding:12px;
    border-radius:7px;
    margin-bottom:18px;
    font-size:14px;
    line-height:1.5;
}

.photo-note{
    font-size:13px;
    color:#666;
    margin-top:6px;
}

.preview-box{
    text-align:center;
    margin-top:12px;
}

#photoPreview{
    display:none;
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:50%;
    border:3px solid #075e54;
}

</style>

</head>

<body>


<header>

<h1>
GDJSS CENTRAL CLASS OF 2021
</h1>

<p>
Member Registration
</p>

</header>


<div class="container">

<div class="form-box">


<h2>
Register as a Member
</h2>


<div class="note">

Please fill in your correct information.
Your registration will be reviewed by the
administrator before approval.

</div>


<form id="registrationForm">


<!-- FULL NAME -->

<label for="fullName">
Full Name
</label>

<input
type="text"
id="fullName"
placeholder="Enter your full name"
required
>


<!-- PHONE -->

<label for="phone">
Phone Number
</label>

<input
type="tel"
id="phone"
placeholder="Enter phone number"
required
>


<!-- GENDER -->

<label for="gender">
Gender
</label>

<select
id="gender"
required
>

<option value="">
Select Gender
</option>

<option value="Male">
Male
</option>

<option value="Female">
Female
</option>

</select>


<!-- STATE -->

<label for="state">
State
</label>

<input
type="text"
id="state"
placeholder="Enter your state"
required
>


<!-- CITY -->

<label for="city">
City / Town
</label>

<input
type="text"
id="city"
placeholder="Enter city or town"
required
>


<!-- ADDRESS -->

<label for="address">
Current Address
</label>

<textarea
id="address"
placeholder="Enter your current address"
></textarea>


<!-- CLASS -->

<label for="classSection">
Class / Section
</label>

<input
type="text"
id="classSection"
placeholder="Example: A, B, Science, Arts"
>


<!-- WHATSAPP -->

<label for="whatsapp">
WhatsApp Number
</label>

<input
type="tel"
id="whatsapp"
placeholder="Enter WhatsApp number"
>


<!-- OCCUPATION -->

<label for="occupation">
Occupation
</label>

<input
type="text"
id="occupation"
placeholder="Enter your occupation"
>


<!-- EMAIL -->

<label for="email">
Email
</label>

<input
type="email"
id="email"
placeholder="Enter email address"
>


<!-- PASSPORT PHOTO -->

<label for="photo">
Passport Photo
</label>

<input
type="file"
id="photo"
accept="image/jpeg,image/png,image/webp"
required
>

<div class="photo-note">
Please upload a clear passport photograph.
JPG, PNG or WEBP only. Maximum size: 5MB.
</div>


<div class="preview-box">

<img
id="photoPreview"
alt="Passport Photo Preview"
>

</div>


<!-- SUBMIT -->

<button
type="submit"
id="submitButton"
>
Submit Registration
</button>


<div id="message"></div>


</form>


</div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
    "https://nfivwaxynfcqumupcttp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_cW8I1UvkW1jvGNDeh_NTPg_QicAc9G7";


const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth:{
                persistSession:false,
                autoRefreshToken:false,
                detectSessionInUrl:false
            }
        }
    );


/* =====================================================
   ELEMENTS
===================================================== */

const form =
    document.getElementById(
        "registrationForm"
    );

const message =
    document.getElementById(
        "message"
    );

const submitButton =
    document.getElementById(
        "submitButton"
    );

const photoInput =
    document.getElementById(
        "photo"
    );

const photoPreview =
    document.getElementById(
        "photoPreview"
    );


/* =====================================================
   PHOTO PREVIEW
===================================================== */

photoInput.addEventListener(
    "change",
    function(){

        const file =
            photoInput.files[0];

        if(!file){

            photoPreview.style.display =
                "none";

            return;
        }


        if(!file.type.startsWith("image/")){

            photoInput.value = "";

            photoPreview.style.display =
                "none";

            message.className =
                "error";

            message.textContent =
                "Please select an image file.";

            return;
        }


        if(file.size > 5 * 1024 * 1024){

            photoInput.value = "";

            photoPreview.style.display =
                "none";

            message.className =
                "error";

            message.textContent =
                "Photo is too large. Maximum size is 5MB.";

            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            function(event){

                photoPreview.src =
                    event.target.result;

                photoPreview.style.display =
                    "inline-block";

            };


        reader.readAsDataURL(file);

    }
);


/* =====================================================
   FORM SUBMIT
===================================================== */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        message.className =
            "loading";

        message.textContent =
            "Submitting registration...";


        submitButton.disabled =
            true;


        try{


            /* =========================================
               GET FORM VALUES
            ========================================= */

            const fullName =
                document
                .getElementById("fullName")
                .value
                .trim();


            const phone =
                document
                .getElementById("phone")
                .value
                .trim();


            const gender =
                document
                .getElementById("gender")
                .value;


            const state =
                document
                .getElementById("state")
                .value
                .trim();


            const city =
                document
                .getElementById("city")
                .value
                .trim();


            const address =
                document
                .getElementById("address")
                .value
                .trim();


            const classSection =
                document
                .getElementById("classSection")
                .value
                .trim();


            const whatsapp =
                document
                .getElementById("whatsapp")
                .value
                .trim();


            const occupation =
                document
                .getElementById("occupation")
                .value
                .trim();


            const email =
                document
                .getElementById("email")
                .value
                .trim();


            const photo =
                photoInput.files[0];


            /* =========================================
               VALIDATION
            ========================================= */

            if(!fullName){

                throw new Error(
                    "Please enter your full name."
                );

            }


            if(!phone){

                throw new Error(
                    "Please enter your phone number."
                );

            }


            if(!gender){

                throw new Error(
                    "Please select your gender."
                );

            }


            if(!state){

                throw new Error(
                    "Please enter your state."
                );

            }


            if(!city){

                throw new Error(
                    "Please enter your city or town."
                );

            }


            if(!photo){

                throw new Error(
                    "Please select your passport photo."
                );

            }


            if(photo.size > 5 * 1024 * 1024){

                throw new Error(
                    "Photo is too large. Maximum size is 5MB."
                );

            }


            if(!photo.type.startsWith("image/")){

                throw new Error(
                    "Please upload a valid image."
                );

            }


            /* =========================================
               CREATE UNIQUE PHOTO NAME
            ========================================= */

            const fileExtension =
                photo.name
                .split(".")
                .pop()
                .toLowerCase();


            const safeName =
                fullName
                .toLowerCase()
                .replace(
                    /[^a-z0-9]+/g,
                    "-"
                )
                .replace(
                    /^-+|-+$/g,
                    ""
                );


            const fileName =
                Date.now() +
                "-" +
                Math.random()
                .toString(36)
                .substring(2,8) +
                "-" +
                safeName +
                "." +
                fileExtension;


            const filePath =
                "members/" +
                fileName;


            /* =========================================
               UPLOAD PHOTO
            ========================================= */

            message.className =
                "loading";

            message.textContent =
                "Uploading passport photo...";


            const uploadResult =
                await db.storage
                .from("member-photos")
                .upload(
                    filePath,
                    photo,
                    {
                        cacheControl:"3600",
                        upsert:false,
                        contentType:photo.type
                    }
                );


            if(uploadResult.error){

                console.error(
                    "Photo upload error:",
                    uploadResult.error
                );

                throw new Error(
                    "Photo upload failed: " +
                    uploadResult.error.message
                );

            }


            /* =========================================
               GET PUBLIC PHOTO URL
            ========================================= */

            const publicUrlResult =
                db.storage
                .from("member-photos")
                .getPublicUrl(
                    filePath
                );


            const photoUrl =
                publicUrlResult
                .data
                .publicUrl;


            if(!photoUrl){

                throw new Error(
                    "Could not create photo URL."
                );

            }


            /* =========================================
               SAVE REGISTRATION
            ========================================= */

            message.className =
                "loading";

            message.textContent =
                "Saving registration...";


            const insertResult =
                await db
                .from("registrations")
                .insert({

                    full_name:
                        fullName,

                    phone:
                        phone,

                    gender:
                        gender,

                    state:
                        state,

                    city:
                        city,

                    address:
                        address,

                    class_section:
                        classSection,

                    whatsapp:
                        whatsapp,

                    occupation:
                        occupation,

                    email:
                        email,

                    photo_url:
                        photoUrl,

                    status:
                        "pending"

                });


            if(insertResult.error){

                console.error(
                    "Database error:",
                    insertResult.error
                );


                /*
                   If database insert fails,
                   remove uploaded photo so
                   we don't leave unused files.
                */

                await db.storage
                .from("member-photos")
                .remove([
                    filePath
                ]);


                throw new Error(
                    "Database error: " +
                    insertResult.error.message
                );

            }


            /* =========================================
               SUCCESS
            ========================================= */

            message.className =
                "success";

            message.textContent =
                "Registration submitted successfully! Your passport photo has also been saved. Please wait for admin approval.";


            form.reset();


            photoPreview.src = "";

            photoPreview.style.display =
                "none";


        }catch(error){

            console.error(
                "Registration error:",
                error
            );


            message.className =
                "error";

            message.textContent =
                "Error: " +
                (
                    error.message ||
                    "Something went wrong."
                );

        }finally{

            submitButton.disabled =
                false;

        }

    }
);

</script>

</body>
</html>
