<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GDJSS CENTRAL CLASS OF 2021 - Member Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6f9;
    padding:25px 15px;
}

.container{
    max-width:500px;
    margin:auto;
}

.header{
    background:#0b3d2e;
    color:white;
    text-align:center;
    padding:25px 15px;
    border-radius:15px 15px 0 0;
}

.header h1{
    margin:0 0 8px;
    font-size:22px;
}

.header p{
    margin:0;
}

.card{
    background:white;
    padding:25px;
    border-radius:0 0 15px 15px;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
}

label{
    display:block;
    font-weight:bold;
    margin-top:15px;
    margin-bottom:6px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:0;
    border-radius:7px;
    background:#0b3d2e;
    color:white;
    font-size:16px;
    font-weight:bold;
}

button:disabled{
    background:#777;
}

.gray{
    background:#555;
}

.message{
    margin-top:18px;
    text-align:center;
    line-height:1.5;
    font-weight:bold;
}

.error{
    color:#dc3545;
}

.success{
    color:#198754;
}

.note{
    background:#eef8f6;
    padding:13px;
    border-radius:8px;
    font-size:14px;
    line-height:1.5;
}

.footer{
    text-align:center;
    color:#666;
    font-size:13px;
    margin-top:18px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">

<h1>
GDJSS CENTRAL CLASS OF 2021
</h1>

<p>
Member Portal
</p>

</div>


<div class="card">

<h2>🔐 Member Login</h2>

<div class="note">

Use the email and password you created
for your GDJSS member account.

</div>


<label>Email Address</label>

<input
type="email"
id="email"
placeholder="Enter email"
autocomplete="email"
>


<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter password"
autocomplete="current-password"
>


<button
type="button"
id="loginButton"
>
Login
</button>


<div
id="message"
class="message"
></div>


<hr style="margin:25px 0;border:0;border-top:1px solid #ddd;">


<button
type="button"
class="gray"
onclick="window.location.href='member-dashboard.html'"
>
Create / Manage Member Account
</button>

</div>


<div class="footer">

GDJSS Central Class of 2021 Association

</div>

</div>


<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://nfivwaxynfcqumupcttp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_cW8I1UvkW1jvGNDeh_NTPg_QicAc9G7";


const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        auth:{
            persistSession:true,
            autoRefreshToken:true,
            detectSessionInUrl:true
        }
    }
);


/* ================================
   LOGIN
================================ */

document
.getElementById("loginButton")
.addEventListener(
"click",
loginMember
);


async function loginMember(){

const email =
document
.getElementById("email")
.value
.trim()
.toLowerCase();


const password =
document
.getElementById("password")
.value;


const message =
document
.getElementById("message");


const button =
document
.getElementById("loginButton");


if(!email || !password){

message.className =
"message error";

message.textContent =
"Please enter your email and password.";

return;

}


button.disabled = true;

button.textContent =
"Logging in...";

message.className =
"message";

message.textContent =
"";


try{

const result =
await db.auth.signInWithPassword({

email:email,

password:password

});


if(result.error){

console.error(
"LOGIN ERROR:",
result.error
);

message.className =
"message error";

message.textContent =
result.error.message;

return;

}


/* LOGIN SUCCESS */

message.className =
"message success";

message.textContent =
"Login successful. Opening dashboard...";


setTimeout(
function(){

window.location.href =
"member-dashboard.html";

},
700
);


}catch(error){

console.error(
"ERROR:",
error
);

message.className =
"message error";

message.textContent =
error.message ||
"Login failed.";

}finally{

button.disabled = false;

button.textContent =
"Login";

}

}

</script>

</body>
</html>
