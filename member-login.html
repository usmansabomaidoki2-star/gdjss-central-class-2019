<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GDJSS CENTRAL CLASS OF 2021 - Member Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6f9;
    color:#222;
    padding:25px 15px;
}

.container{
    width:100%;
    max-width:500px;
    margin:auto;
}

.header{
    background:#0b3d2e;
    color:white;
    text-align:center;
    padding:25px 15px;
    border-radius:15px 15px 0 0;
}

.header h1{
    margin:0 0 8px;
    font-size:22px;
}

.header p{
    margin:0;
    font-size:15px;
}

.card{
    background:white;
    padding:25px;
    border-radius:0 0 15px 15px;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
}

label{
    display:block;
    font-weight:bold;
    margin-top:15px;
    margin-bottom:6px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:0;
    border-radius:7px;
    background:#0b3d2e;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    background:#777;
}

.gray{
    background:#555;
}

.message{
    margin-top:18px;
    text-align:center;
    line-height:1.5;
    font-weight:bold;
}

.error{
    color:#dc3545;
}

.success{
    color:#198754;
}

.note{
    background:#eef8f6;
    padding:13px;
    border-radius:8px;
    font-size:14px;
    line-height:1.5;
}

.footer{
    text-align:center;
    color:#666;
    font-size:13px;
    margin-top:18px;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>
GDJSS CENTRAL CLASS OF 2021
</h1>

<p>
Member Portal
</p>

</div>


<div class="card">

<h2>🔐 Member Login</h2>

<div class="note">

Use the email and password you created
for your GDJSS member account.

</div>


<label for="email">
Email Address
</label>

<input
type="email"
id="email"
placeholder="Enter your email"
autocomplete="email"
>


<label for="password">
Password
</label>

<input
type="password"
id="password"
placeholder="Enter your password"
autocomplete="current-password"
>


<button
type="button"
id="loginButton"
>
Login
</button>


<div
id="message"
class="message"
></div>


<hr
style="
margin:25px 0;
border:0;
border-top:1px solid #ddd;
">


<button
type="button"
class="gray"
id="dashboardButton"
>
Open Member Dashboard
</button>

</div>


<div class="footer">

GDJSS Central Class of 2021 Association

</div>

</div>


<script>

/* =========================================
   SUPABASE CONFIG
========================================= */

const SUPABASE_URL =
"https://nfivwaxynfcqumupcttp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_cW8I1UvkW1jvGNDeh_NTPg_QicAc9G7";


const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        auth:{
            persistSession:true,
            autoRefreshToken:true,
            detectSessionInUrl:true
        }
    }
);


/* =========================================
   DASHBOARD URL
========================================= */

const DASHBOARD_URL =
"https://usmansabomaidoki2-star.github.io/gdjss-central-class-2019/member-dashboard.html";


/* =========================================
   ELEMENTS
========================================= */

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginButton =
document.getElementById("loginButton");

const dashboardButton =
document.getElementById("dashboardButton");

const message =
document.getElementById("message");


/* =========================================
   LOGIN
========================================= */

loginButton.addEventListener(
    "click",
    loginMember
);


async function loginMember(){

    const email =
        emailInput.value
        .trim()
        .toLowerCase();


    const password =
        passwordInput.value;


    if(!email || !password){

        message.className =
            "message error";

        message.textContent =
            "Please enter your email and password.";

        return;
    }


    loginButton.disabled =
        true;

    loginButton.textContent =
        "Logging in...";


    message.className =
        "message";

    message.textContent =
        "";


    try{

        /* =========================
           SUPABASE LOGIN
        ========================= */

        const result =
            await db.auth.signInWithPassword({

                email:email,

                password:password

            });


        if(result.error){

            console.error(
                "LOGIN ERROR:",
                result.error
            );

            message.className =
                "message error";

            message.textContent =
                result.error.message;

            return;
        }


        if(
            !result.data ||
            !result.data.user
        ){

            message.className =
                "message error";

            message.textContent =
                "Login failed.";

            return;
        }


        /* =========================
           LOGIN SUCCESS
        ========================= */

        message.className =
            "message success";

        message.textContent =
            "Login successful. Opening dashboard...";


        /*
           SAVE SESSION
        */

        localStorage.setItem(
            "gdjss_logged_in",
            "true"
        );


        /*
           OPEN DASHBOARD
        */

        setTimeout(
            function(){

                window.location.replace(
                    DASHBOARD_URL
                );

            },
            700
        );


    }catch(error){

        console.error(
            "ERROR:",
            error
        );

        message.className =
            "message error";

        message.textContent =
            error.message ||
            "Login failed.";

    }finally{

        loginButton.disabled =
            false;

        loginButton.textContent =
            "Login";

    }

}


/* =========================================
   OPEN DASHBOARD BUTTON
========================================= */

dashboardButton.addEventListener(
    "click",
    function(){

        window.location.href =
            DASHBOARD_URL;

    }
);


/* =========================================
   ENTER KEY LOGIN
========================================= */

passwordInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            loginMember();

        }

    }
);


/* =========================================
   CHECK EXISTING SESSION
========================================= */

async function checkExistingSession(){

    try{

        const result =
            await db.auth.getSession();


        if(
            result.data &&
            result.data.session
        ){

            /*
               DO NOT REDIRECT AUTOMATICALLY
               unless user has logged in before.
            */

            if(
                localStorage.getItem(
                    "gdjss_logged_in"
                ) === "true"
            ){

                message.className =
                    "message success";

                message.textContent =
                    "You are already logged in. Opening dashboard...";


                setTimeout(
                    function(){

                        window.location.replace(
                            DASHBOARD_URL
                        );

                    },
                    500
                );

            }

        }

    }catch(error){

        console.error(error);

    }

}


checkExistingSession();

</script>

</body>
</html>
