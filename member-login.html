<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GDJSS 2021 - Member Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef3f1;
    color:#222;
    padding:25px 15px;
}

.container{
    max-width:500px;
    margin:auto;
}

.header{
    background:#0b3d2e;
    color:white;
    text-align:center;
    padding:25px 15px;
    border-radius:15px 15px 0 0;
}

.header h1{
    margin:0 0 8px;
    font-size:22px;
}

.header p{
    margin:0;
    font-size:14px;
}

.card{
    background:white;
    padding:25px;
    border-radius:0 0 15px 15px;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
}

.tabs{
    display:flex;
    gap:8px;
    margin-bottom:20px;
}

.tabs button{
    flex:1;
    padding:12px;
    border:1px solid #0b3d2e;
    background:white;
    color:#0b3d2e;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;
}

.tabs button.active{
    background:#0b3d2e;
    color:white;
}

.form-section{
    display:none;
}

.form-section.active{
    display:block;
}

label{
    display:block;
    font-weight:bold;
    margin-top:14px;
    margin-bottom:6px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:16px;
}

.action{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:0;
    border-radius:7px;
    background:#0b3d2e;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.action:disabled{
    background:#777;
}

#message{
    margin-top:18px;
    text-align:center;
    line-height:1.5;
}

.success{
    color:#198754;
    font-weight:bold;
}

.error{
    color:#dc3545;
    font-weight:bold;
}

.info{
    background:#eef8f6;
    padding:12px;
    border-radius:7px;
    font-size:14px;
    line-height:1.5;
    margin-bottom:15px;
}

.footer{
    text-align:center;
    color:#666;
    font-size:13px;
    margin-top:20px;
}

</style>
</head>

<body>

<div class="container">

<div class="header">

<h1>
GDJSS CENTRAL CLASS OF 2021
</h1>

<p>
Member Portal
</p>

</div>


<div class="card">

<div class="tabs">

<button
type="button"
id="loginTab"
class="active"
onclick="showLogin()"
>
Login
</button>

<button
type="button"
id="setupTab"
onclick="showSetup()"
>
Create Account
</button>

</div>


<!-- =========================
     LOGIN
========================= -->

<div
id="loginSection"
class="form-section active"
>

<h2>
🔐 Member Login
</h2>

<label>
Email
</label>

<input
type="email"
id="loginEmail"
placeholder="Enter your registered email"
autocomplete="email"
>

<label>
Password
</label>

<input
type="password"
id="loginPassword"
placeholder="Enter your password"
autocomplete="current-password"
>

<button
type="button"
class="action"
id="loginButton"
>
Login
</button>

</div>


<!-- =========================
     CREATE ACCOUNT
========================= -->

<div
id="setupSection"
class="form-section"
>

<h2>
📝 Create Member Account
</h2>

<div class="info">

Your registration must already be
<b>approved by Admin</b>.

Use the same email address used during registration.

</div>

<label>
Member ID
</label>

<input
type="text"
id="memberId"
placeholder="GDJSS-2021-0001"
>

<label>
Registered Email
</label>

<input
type="email"
id="setupEmail"
placeholder="Enter your registered email"
autocomplete="email"
>

<label>
Create Password
</label>

<input
type="password"
id="setupPassword"
placeholder="Create a password"
autocomplete="new-password"
>

<label>
Confirm Password
</label>

<input
type="password"
id="confirmPassword"
placeholder="Repeat your password"
autocomplete="new-password"
>

<button
type="button"
class="action"
id="setupButton"
>
Create Member Account
</button>

</div>


<div id="message"></div>

</div>


<div class="footer">

GDJSS Central Class of 2021 Association

</div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://nfivwaxynfcqumupcttp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_cW8I1UvkW1jvGNDeh_NTPg_QicAc9G7";


const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY,
{
    auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
    }
}
);


/* =========================================
   ELEMENTS
========================================= */

const message =
document.getElementById("message");

const loginButton =
document.getElementById("loginButton");

const setupButton =
document.getElementById("setupButton");


/* =========================================
   TABS
========================================= */

function showLogin(){

    document
    .getElementById("loginSection")
    .classList.add("active");

    document
    .getElementById("setupSection")
    .classList.remove("active");

    document
    .getElementById("loginTab")
    .classList.add("active");

    document
    .getElementById("setupTab")
    .classList.remove("active");

    message.textContent="";

}


function showSetup(){

    document
    .getElementById("setupSection")
    .classList.add("active");

    document
    .getElementById("loginSection")
    .classList.remove("active");

    document
    .getElementById("setupTab")
    .classList.add("active");

    document
    .getElementById("loginTab")
    .classList.remove("active");

    message.textContent="";

}


/* =========================================
   LOGIN
========================================= */

loginButton.addEventListener(
"click",
loginMember
);


async function loginMember(){

    const email =
    document
    .getElementById("loginEmail")
    .value
    .trim()
    .toLowerCase();


    const password =
    document
    .getElementById("loginPassword")
    .value;


    if(!email || !password){

        showError(
            "Please enter your email and password."
        );

        return;

    }


    loginButton.disabled=true;

    loginButton.textContent=
    "Logging in...";


    try{

        /*
           LOGIN TO SUPABASE AUTH
        */

        const result =
        await db.auth.signInWithPassword({

            email:email,

            password:password

        });


        if(result.error){

            throw result.error;

        }


        const user =
        result.data.user;


        if(!user){

            throw new Error(
                "Login failed."
            );

        }


        /*
           FIND APPROVED MEMBER
           USING REGISTRATIONS
        */

        const memberResult =
        await db
        .from("registrations")
        .select(
            "id,full_name,email,status,member_id,user_id"
        )
        .eq(
            "email",
            email
        )
        .eq(
            "status",
            "approved"
        )
        .not(
            "member_id",
            "is",
            null
        )
        .order(
            "id",
            {
                ascending:false
            }
        )
        .limit(1)
        .maybeSingle();


        if(memberResult.error){

            throw memberResult.error;

        }


        if(!memberResult.data){

            await db.auth.signOut();

            throw new Error(
                "This email is not linked to an approved GDJSS 2021 member."
            );

        }


        const member =
        memberResult.data;


        /*
           CHECK USER LINK
        */

        if(
            member.user_id &&
            member.user_id !== user.id
        ){

            await db.auth.signOut();

            throw new Error(
                "This member record is already linked to another account."
            );

        }


        /*
           IF USER_ID IS EMPTY,
           LINK CURRENT AUTH USER
        */

        if(
            !member.user_id
        ){

            const linkResult =
            await db
            .from("registrations")
            .update({

                user_id:
                user.id

            })
            .eq(
                "id",
                member.id
            );


            if(linkResult.error){

                console.error(
                    linkResult.error
                );

            }

        }


        showSuccess(
            "Login successful. Opening Member Dashboard..."
        );


        setTimeout(
            function(){

                window.location.href =
                "member-dashboard.html";

            },
            700
        );


    }catch(error){

        console.error(error);

        showError(
            error.message ||
            "Something went wrong."
        );

    }finally{

        loginButton.disabled=false;

        loginButton.textContent=
        "Login";

    }

}


/* =========================================
   CREATE ACCOUNT
========================================= */

setupButton.addEventListener(
"click",
createAccount
);


async function createAccount(){

    const memberId =
    document
    .getElementById("memberId")
    .value
    .trim()
    .toUpperCase();


    const email =
    document
    .getElementById("setupEmail")
    .value
    .trim()
    .toLowerCase();


    const password =
    document
    .getElementById("setupPassword")
    .value;


    const confirmPassword =
    document
    .getElementById("confirmPassword")
    .value;


    if(
        !memberId ||
        !email ||
        !password ||
        !confirmPassword
    ){

        showError(
            "Please fill in all fields."
        );

        return;

    }


    if(password.length < 6){

        showError(
            "Password must be at least 6 characters."
        );

        return;

    }


    if(password !== confirmPassword){

        showError(
            "Passwords do not match."
        );

        return;

    }


    setupButton.disabled=true;

    setupButton.textContent=
    "Checking member...";


    try{

        /*
           CHECK APPROVED MEMBER
        */

        const memberResult =
        await db
        .from("registrations")
        .select(
            "id,member_id,email,status,user_id"
        )
        .eq(
            "member_id",
            memberId
        )
        .eq(
            "status",
            "approved"
        )
        .maybeSingle();


        if(memberResult.error){

            throw memberResult.error;

        }


        if(!memberResult.data){

            throw new Error(
                "Approved GDJSS 2021 member was not found."
            );

        }


        const member =
        memberResult.data;


        if(
            member.email.toLowerCase() !==
            email
        ){

            throw new Error(
                "The email does not match the registration."
            );

        }


        if(member.user_id){

            throw new Error(
                "This member already has an account. Please login."
            );

        }


        /*
           CREATE AUTH ACCOUNT
        */

        setupButton.textContent=
        "Creating account...";


        const signup =
        await db.auth.signUp({

            email:email,

            password:password

        });


        if(signup.error){

            throw signup.error;

        }


        /*
           IF SESSION EXISTS,
           LINK USER ID
        */

        if(
            signup.data &&
            signup.data.session &&
            signup.data.user
        ){

            const link =
            await db
            .from("registrations")
            .update({

                user_id:
                signup.data.user.id

            })
            .eq(
                "id",
                member.id
            );


            if(link.error){

                throw link.error;

            }


            showSuccess(
                "Account created successfully. Opening dashboard..."
            );


            setTimeout(
                function(){

                    window.location.href =
                    "member-dashboard.html";

                },
                700
            );

        }else{

            showSuccess(
                "Account created. Check your email, confirm the account, then login."
            );

        }


    }catch(error){

        console.error(error);

        showError(
            error.message ||
            "Something went wrong."
        );

    }finally{

        setupButton.disabled=false;

        setupButton.textContent=
        "Create Member Account";

    }

}


/* =========================================
   MESSAGES
========================================= */

function showError(text){

    message.className=
    "error";

    message.textContent=
    text;

}


function showSuccess(text){

    message.className=
    "success";

    message.textContent=
    text;

}

</script>

</body>
</html>
