<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GDJSS Member Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef3f1;
    color:#222;
    padding:25px 15px;
}

.container{
    max-width:500px;
    margin:auto;
}

.header{
    background:#0b3d2e;
    color:white;
    text-align:center;
    padding:25px 15px;
    border-radius:15px 15px 0 0;
}

.header h1{
    margin:0 0 8px;
    font-size:22px;
}

.header p{
    margin:0;
    font-size:14px;
}

.card{
    background:white;
    padding:25px;
    border-radius:0 0 15px 15px;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
}

.tabs{
    display:flex;
    gap:8px;
    margin-bottom:20px;
}

.tabs button{
    flex:1;
    padding:12px;
    border:1px solid #0b3d2e;
    background:white;
    color:#0b3d2e;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;
}

.tabs button.active{
    background:#0b3d2e;
    color:white;
}

.form-section{
    display:none;
}

.form-section.active{
    display:block;
}

label{
    display:block;
    font-weight:bold;
    margin-top:14px;
    margin-bottom:6px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:16px;
}

.action{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:0;
    border-radius:7px;
    background:#0b3d2e;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.action:disabled{
    background:#777;
}

#message{
    margin-top:18px;
    text-align:center;
    line-height:1.5;
}

.success{
    color:#198754;
    font-weight:bold;
}

.error{
    color:#dc3545;
    font-weight:bold;
}

.info{
    background:#eef8f6;
    padding:12px;
    border-radius:7px;
    font-size:14px;
    line-height:1.5;
    margin-bottom:15px;
}

.footer{
    text-align:center;
    color:#666;
    font-size:13px;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>GDJSS CENTRAL CLASS OF 2019</h1>
        <p>Member Portal</p>
    </div>

    <div class="card">

        <div class="tabs">

            <button
                type="button"
                id="loginTab"
                class="active"
                onclick="showLogin()"
            >
                Login
            </button>

            <button
                type="button"
                id="setupTab"
                onclick="showSetup()"
            >
                Create Account
            </button>

        </div>


        <!-- LOGIN -->

        <div
            id="loginSection"
            class="form-section active"
        >

            <h2>🔐 Member Login</h2>

            <label for="loginEmail">
                Email
            </label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your registered email"
                autocomplete="email"
            >


            <label for="loginPassword">
                Password
            </label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                autocomplete="current-password"
            >


            <button
                type="button"
                class="action"
                id="loginButton"
            >
                Login
            </button>

        </div>


        <!-- CREATE ACCOUNT -->

        <div
            id="setupSection"
            class="form-section"
        >

            <h2>📝 Create Member Account</h2>

            <div class="info">
                Your registration must already be
                <b>approved by Admin</b> before you can
                create your member account.
            </div>


            <label for="memberId">
                Member ID
            </label>

            <input
                type="text"
                id="memberId"
                placeholder="GDJSS-2019-0001"
            >


            <label for="setupEmail">
                Registered Email
            </label>

            <input
                type="email"
                id="setupEmail"
                placeholder="Enter the email used during registration"
                autocomplete="email"
            >


            <label for="setupPassword">
                Create Password
            </label>

            <input
                type="password"
                id="setupPassword"
                placeholder="Create a password"
                autocomplete="new-password"
            >


            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Repeat your password"
                autocomplete="new-password"
            >


            <button
                type="button"
                class="action"
                id="setupButton"
            >
                Create Member Account
            </button>

        </div>


        <div id="message"></div>

    </div>

    <div class="footer">
        GDJSS Central Class of 2019 Association
    </div>

</div>


<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
    "https://nfivwaxynfcqumupcttp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_cW8I1UvkW1jvGNDeh_NTPg_QicAc9G7";


const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   ELEMENTS
===================================================== */

const message =
    document.getElementById("message");

const loginButton =
    document.getElementById("loginButton");

const setupButton =
    document.getElementById("setupButton");


/* =====================================================
   TABS
===================================================== */

function showLogin(){

    document.getElementById(
        "loginSection"
    ).classList.add("active");

    document.getElementById(
        "setupSection"
    ).classList.remove("active");


    document.getElementById(
        "loginTab"
    ).classList.add("active");

    document.getElementById(
        "setupTab"
    ).classList.remove("active");


    message.innerHTML = "";
}


function showSetup(){

    document.getElementById(
        "setupSection"
    ).classList.add("active");

    document.getElementById(
        "loginSection"
    ).classList.remove("active");


    document.getElementById(
        "setupTab"
    ).classList.add("active");

    document.getElementById(
        "loginTab"
    ).classList.remove("active");


    message.innerHTML = "";
}


/* =====================================================
   LOGIN
===================================================== */

loginButton.addEventListener(
    "click",
    loginMember
);


async function loginMember(){

    const email =
        document.getElementById(
            "loginEmail"
        ).value.trim();

    const password =
        document.getElementById(
            "loginPassword"
        ).value;


    if(!email || !password){

        showError(
            "Please enter your email and password."
        );

        return;
    }


    loginButton.disabled = true;

    loginButton.textContent =
        "Logging in...";


    try{

        const { data, error } =
            await db.auth.signInWithPassword({

                email:email,

                password:password

            });


        if(error){

            showError(
                error.message
            );

            return;
        }


        if(
            !data ||
            !data.user
        ){

            showError(
                "Login failed."
            );

            return;
        }


        /* Check member account */

        const { data:account, error:accountError } =
            await db
            .from("member_accounts")
            .select(
                "member_id,is_active"
            )
            .eq(
                "user_id",
                data.user.id
            )
            .maybeSingle();


        if(accountError){

            showError(
                accountError.message
            );

            await db.auth.signOut();

            return;
        }


        if(
            !account ||
            account.is_active !== true
        ){

            showError(
                "This account is not linked to an active GDJSS member account."
            );

            await db.auth.signOut();

            return;
        }


        showSuccess(
            "Login successful. Opening Member Dashboard..."
        );


        /*
           DASHBOARD FILE ZA MU GINA A GABA.
        */

        setTimeout(
            function(){

                window.location.href =
                    "member-dashboard.html";

            },
            1000
        );


    }catch(error){

        console.error(error);

        showError(
            error.message ||
            "Something went wrong."
        );

    }finally{

        loginButton.disabled = false;

        loginButton.textContent =
            "Login";
    }
}


/* =====================================================
   CREATE ACCOUNT
===================================================== */

setupButton.addEventListener(
    "click",
    createAccount
);


async function createAccount(){

    const memberId =
        document.getElementById(
            "memberId"
        ).value
        .trim()
        .toUpperCase();

    const email =
        document.getElementById(
            "setupEmail"
        ).value
        .trim();

    const password =
        document.getElementById(
            "setupPassword"
        ).value;

    const confirmPassword =
        document.getElementById(
            "confirmPassword"
        ).value;


    if(
        !memberId ||
        !email ||
        !password ||
        !confirmPassword
    ){

        showError(
            "Please fill in all fields."
        );

        return;
    }


    if(password.length < 6){

        showError(
            "Password must be at least 6 characters."
        );

        return;
    }


    if(password !== confirmPassword){

        showError(
            "Passwords do not match."
        );

        return;
    }


    setupButton.disabled = true;

    setupButton.textContent =
        "Creating Account...";


    try{

        /*
           First check that this member
           is approved and email matches.
        */

        const { data:memberData, error:memberError } =
            await db
            .from("registrations")
            .select(
                "id,member_id,email,status"
            )
            .eq(
                "member_id",
                memberId
            )
            .eq(
                "status",
                "approved"
            )
            .maybeSingle();


        if(memberError){

            showError(
                memberError.message
            );

            return;
        }


        if(!memberData){

            showError(
                "Approved member was not found."
            );

            return;
        }


        if(
            memberData.email.toLowerCase() !==
            email.toLowerCase()
        ){

            showError(
                "The email does not match the registration."
            );

            return;
        }


        /*
           Create Supabase Auth account.
        */

        const { data:userData, error:userError } =
            await db.auth.signUp({

                email:email,

                password:password

            });


        if(userError){

            showError(
                userError.message
            );

            return;
        }


        /*
           If Supabase immediately gives a session,
           connect the Auth user to member_accounts.
        */

        if(
            userData &&
            userData.session
        ){

            const { data:accountData, error:accountError } =
                await db.rpc(
                    "create_member_account",
                    {
                        registration_member_id:
                            memberId
                    }
                );


            if(accountError){

                showError(
                    accountError.message
                );

                return;
            }


            showSuccess(
                "Account created successfully!"
            );


            setTimeout(
                function(){

                    window.location.href =
                        "member-dashboard.html";

                },
                1000
            );


        }else{

            /*
               Email confirmation is enabled.
            */

            showSuccess(
                "Account created. Please check your email and confirm your account, then return here and login."
            );
        }


    }catch(error){

        console.error(error);

        showError(
            error.message ||
            "Something went wrong."
        );

    }finally{

        setupButton.disabled = false;

        setupButton.textContent =
            "Create Member Account";
    }
}


/* =====================================================
   MESSAGES
===================================================== */

function showError(text){

    message.className =
        "error";

    message.textContent =
        text;
}


function showSuccess(text){

    message.className =
        "success";

    message.textContent =
        text;
}

</script>

</body>
</html>
