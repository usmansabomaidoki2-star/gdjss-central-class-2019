<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GDJSS Member Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#071a3d,#0b4f9c);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:90%;
    max-width:420px;
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h1{
    text-align:center;
    color:#0b4f9c;
    margin-bottom:5px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:13px;
    margin:7px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:13px;
    margin-top:10px;
    border:0;
    border-radius:8px;
    background:#0b4f9c;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.secondary{
    background:#555;
}

.green{
    background:#16853b;
}

.orange{
    background:#d87900;
}

.message{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

.hidden{
    display:none;
}

.divider{
    text-align:center;
    margin:20px 0 5px;
    color:#888;
}

.small{
    text-align:center;
    color:#777;
    font-size:13px;
    margin-top:18px;
}
</style>
</head>

<body>

<div class="container">

<h1>GDJSS CENTRAL</h1>
<div class="subtitle">CLASS OF 2021 ASSOCIATION</div>

<!-- LOGIN -->
<div id="loginSection">

<h3>Member Login</h3>

<input type="email" id="loginEmail" placeholder="Email Address">

<input type="password" id="loginPassword" placeholder="Password">

<button onclick="login()">Login</button>

<button class="green" onclick="showCreateAccount()">
Create New Account
</button>

<button class="orange" onclick="forgotPassword()">
Forgot Password
</button>

<button class="secondary" onclick="openDashboard()">
Open Member Dashboard
</button>

<div id="loginMessage" class="message"></div>

</div>


<!-- CREATE ACCOUNT -->
<div id="createSection" class="hidden">

<h3>Create New Account</h3>

<input type="email" id="createEmail" placeholder="Approved Registration Email">

<input type="password" id="createPassword" placeholder="Create Password">

<input type="password" id="confirmPassword" placeholder="Confirm Password">

<button onclick="createAccount()">
Create Account
</button>

<button class="secondary" onclick="showLogin()">
Back to Login
</button>

<div id="createMessage" class="message"></div>

</div>


<!-- LOGGED IN -->
<div id="sessionSection" class="hidden">

<h3>Account Session</h3>

<p id="sessionText"></p>

<button onclick="openDashboard()">
Open Member Dashboard
</button>

<button class="secondary" onclick="logout()">
Logout
</button>

</div>

<div class="small">
GDJSS CENTRAL CLASS OF 2021 ASSOCIATION
</div>

</div>


<script>

const SUPABASE_URL =
"https://nfivwaxynfcqumupcttp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_cW8I1UvkW1jvGNDeh_NTPg_QicAc9G7";

const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* CHANGE THIS ONLY IF YOUR DASHBOARD FILE HAS A DIFFERENT NAME */
const DASHBOARD_URL =
"https://usmansabomaidoki2-star.github.io/gdjss-central-class-2019/member-dashboard.html";


function showCreateAccount(){

    document.getElementById("loginSection")
        .classList.add("hidden");

    document.getElementById("createSection")
        .classList.remove("hidden");

}


function showLogin(){

    document.getElementById("createSection")
        .classList.add("hidden");

    document.getElementById("loginSection")
        .classList.remove("hidden");

}


async function login(){

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    const message =
        document.getElementById("loginMessage");

    if(!email || !password){

        message.textContent =
        "Please enter email and password.";

        return;
    }

    message.textContent = "Logging in...";

    const { data, error } =
        await db.auth.signInWithPassword({
            email: email,
            password: password
        });

    if(error){

        message.textContent =
        "Login failed: " + error.message;

        return;
    }

    const user = data.user;

    const { data: account, error: accountError } =
        await db
        .from("member_accounts")
        .select("member_id,is_active")
        .eq("user_id", user.id)
        .maybeSingle();

    if(accountError){

        message.textContent =
        "Account check failed: " +
        accountError.message;

        return;
    }

    if(!account){

        await db.auth.signOut();

        message.textContent =
        "This account is not linked to an active GDJSS member account.";

        return;
    }

    if(account.is_active !== true){

        await db.auth.signOut();

        message.textContent =
        "Your GDJSS member account is not active yet.";

        return;
    }

    localStorage.setItem(
        "gdjss_logged_in",
        "true"
    );

    window.location.href =
        DASHBOARD_URL;
}


async function createAccount(){

    const email =
        document.getElementById("createEmail").value.trim();

    const password =
        document.getElementById("createPassword").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const message =
        document.getElementById("createMessage");

    if(!email || !password || !confirmPassword){

        message.textContent =
        "Please fill all fields.";

        return;
    }

    if(password.length < 6){

        message.textContent =
        "Password must be at least 6 characters.";

        return;
    }

    if(password !== confirmPassword){

        message.textContent =
        "Passwords do not match.";

        return;
    }

    message.textContent =
        "Checking your GDJSS registration...";


    /* CHECK APPROVED REGISTRATION */

    const { data: registration, error: regError } =
        await db
        .from("registrations")
        .select("id,email,status,member_id,user_id")
        .eq("email", email)
        .maybeSingle();


    if(regError){

        message.textContent =
        "Registration check failed: " +
        regError.message;

        return;
    }


    if(!registration){

        message.textContent =
        "No GDJSS registration found with this email.";

        return;
    }


    if(registration.status !== "approved"){

        message.textContent =
        "Your registration is not approved yet.";

        return;
    }


    /* CHECK EXISTING MEMBER ACCOUNT */

    const { data: existingAccount } =
        await db
        .from("member_accounts")
        .select("id")
        .eq("registration_id", registration.id)
        .maybeSingle();


    if(existingAccount){

        message.textContent =
        "This member already has an account. Please login.";

        return;
    }


    message.textContent =
        "Creating your account...";


    const { data: authData, error: authError } =
        await db.auth.signUp({

            email: email,

            password: password

        });


    if(authError){

        message.textContent =
        "Account creation failed: " +
        authError.message;

        return;
    }


    const user = authData.user;


    if(!user){

        message.textContent =
        "Account could not be created.";

        return;
    }


    /* CREATE MEMBER ACCOUNT LINK */

    const { error: accountInsertError } =
        await db
        .from("member_accounts")
        .insert({

            user_id: user.id,

            registration_id: registration.id,

            member_id: registration.member_id,

            is_active: true

        });


    if(accountInsertError){

        message.textContent =
        "Account created, but member linking failed: " +
        accountInsertError.message;

        return;
    }


    /* LINK USER TO REGISTRATION */

    await db
        .from("registrations")
        .update({
            user_id: user.id
        })
        .eq("id", registration.id);


    if(authData.session){

        message.textContent =
        "Account created successfully! Opening dashboard...";

        setTimeout(function(){

            window.location.href =
                DASHBOARD_URL;

        },1000);

    }else{

        message.textContent =
        "Account created successfully. Check your email to confirm your account, then login.";

    }

}


async function forgotPassword(){

    const email =
        document.getElementById("loginEmail").value.trim();

    const message =
        document.getElementById("loginMessage");

    if(!email){

        message.textContent =
        "Enter your email address first.";

        return;
    }

    message.textContent =
        "Sending password reset email...";


    const { error } =
        await db.auth.resetPasswordForEmail(
            email,
            {
                redirectTo: DASHBOARD_URL
            }
        );


    if(error){

        message.textContent =
        "Reset failed: " + error.message;

        return;
    }


    message.textContent =
        "Password reset link has been sent to your email.";

}


function openDashboard(){

    window.location.href =
        DASHBOARD_URL;

}


async function logout(){

    await db.auth.signOut();

    localStorage.removeItem(
        "gdjss_logged_in"
    );

    showLogin();

}


async function checkSession(){

    const { data } =
        await db.auth.getSession();

    if(data.session){

        document.getElementById("loginSection")
            .classList.add("hidden");

        document.getElementById("createSection")
            .classList.add("hidden");

        document.getElementById("sessionSection")
            .classList.remove("hidden");

        document.getElementById("sessionText")
            .textContent =
            "You are logged in as " +
            data.session.user.email;

    }

}


db.auth.onAuthStateChange(
    function(event, session){

        if(session){

            document.getElementById("loginSection")
                .classList.add("hidden");

            document.getElementById("createSection")
                .classList.add("hidden");

            document.getElementById("sessionSection")
                .classList.remove("hidden");

            document.getElementById("sessionText")
                .textContent =
                "You are logged in as " +
                session.user.email;

        }

    }
);


checkSession();

</script>

</body>
</html>
